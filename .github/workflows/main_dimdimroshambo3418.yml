name: Build and deploy JAR app to Azure Web App - dimdimroshambo3418

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Rename WAR to ROOT for Tomcat root deployment
        run: |
          mkdir -p deploy_dir
          cp target/*.war deploy_dir/ROOT.war || cp target/*.jar deploy_dir/ROOT.jar

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: 'deploy_dir/*'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
  
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_64667BD7F23A4AC9A2577604559E3667 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7163DC7C546048D085569061B89B5B74 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_96152245D2FD423DBFDE05EA921C6F5E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dimdimroshambo3418'
          slot-name: 'Production'
          package: '.'
